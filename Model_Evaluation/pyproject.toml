[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-model-evaluation"
version = "0.1.0"
description = "Isolated Juliet evaluation harness for llm-security"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.2,<5", "ipykernel>=6.29,<7"]

[project.scripts]
llm-security-eval = "model_evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
