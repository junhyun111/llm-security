[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-pipeline"
version = "0.1.0"
description = "Evidence-guided conditional expert pipeline for C/C++ vulnerability experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-c>=0.24,<0.25",
  "tree-sitter-cpp>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0",
  "pytest>=8.0",
]

[project.scripts]
llm-security = "llm_security.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
